<section class="card dlc-theme hidden" id="lp-convert-card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem">
    <h2>Convert to Lightning-Pose Project</h2>
    <button class="btn-sm" id="btn-close-lp-convert" title="Close">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Close
    </button>
  </div>
  <p class="subtitle">Converts the active DLC project to a multi-view Lightning-Pose layout. Source project is never modified.</p>

  <div class="lp-field">
    <label>Active DLC project</label>
    <div id="lp-convert-active" style="font-family:var(--mono);font-size:.78rem;padding:.3rem .5rem;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;color:var(--text-dim);min-height:1.5rem">
      <em>load a DLC project in the "DeepLabCut Project Manager" card first</em>
    </div>
  </div>
  <div class="lp-field">
    <label>Output LP project path <span style="color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0">(optional — defaults to <code style="font-family:var(--mono);font-size:.7rem">&lt;project&gt;-LP/</code>)</span></label>
    <input type="text" id="lp-convert-dst" placeholder="leave empty to use the default">
  </div>
  <div class="lp-field lp-checkbox">
    <input type="checkbox" id="lp-convert-force">
    <label for="lp-convert-force">Overwrite if target directory is not empty</label>
  </div>

  <button class="btn-primary" id="btn-lp-convert-run">Run conversion</button>

  <pre class="lp-result" id="lp-convert-result" hidden></pre>
</section>
