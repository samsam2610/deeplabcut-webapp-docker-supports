<section class="card dlc-theme hidden" id="lp-train-card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem">
    <h2>Train Lightning-Pose Model</h2>
    <button class="btn-sm" id="btn-close-lp-train" title="Close">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Close
    </button>
  </div>
  <p class="subtitle">Train an LP model on the converted multi-view project. Runs on the dlc-3d-worker (GPU 0).</p>

  <div class="lp-field">
    <label>LP project path <span style="color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0">(auto-filled from active DLC project; override if needed)</span></label>
    <input type="text" id="lp-train-project" placeholder="auto-filled — load a DLC project first">
  </div>

  <fieldset class="lp-group">
    <legend>Multi-View Options</legend>
    <div class="lp-field lp-checkbox">
      <input type="checkbox" id="lp-train-mvt" checked>
      <label for="lp-train-mvt">Enable Multi-View Transformer (MVT)</label>
    </div>
    <div class="lp-field lp-checkbox">
      <input type="checkbox" id="lp-train-pm">
      <label for="lp-train-pm">Enable patch masking</label>
    </div>
    <div class="lp-row" id="lp-train-pm-params" style="display:none">
      <label>init epoch <input type="number" id="lp-train-pm-init-epoch" value="5" min="0"></label>
      <label>final epoch <input type="number" id="lp-train-pm-final-epoch" value="50" min="1"></label>
      <label>init ratio <input type="number" id="lp-train-pm-init-ratio" value="0" min="0" max="1" step="0.05"></label>
      <label>final ratio <input type="number" id="lp-train-pm-final-ratio" value="0.5" min="0" max="1" step="0.05"></label>
    </div>
    <div class="lp-field lp-checkbox">
      <input type="checkbox" id="lp-train-reproj">
      <label for="lp-train-reproj">Enable 3D reprojection loss (requires calibration)</label>
    </div>
    <div class="lp-row" id="lp-train-reproj-params" style="display:none">
      <label>log weight <input type="number" id="lp-train-reproj-weight" value="3.0" step="0.1"></label>
    </div>
  </fieldset>

  <fieldset class="lp-group">
    <legend>Pretraining</legend>
    <div class="lp-field lp-checkbox">
      <input type="checkbox" id="lp-train-two-stage">
      <label for="lp-train-two-stage">Pretrain ViT backbone on all labels (single-view first, then MVT)</label>
    </div>
    <div class="lp-row" id="lp-train-two-stage-params" style="display:none">
      <label>Stage 1 max epochs <input type="number" id="lp-train-stage1-epochs" value="100" min="1"></label>
      <label>Stage 1 early-stop patience <input type="number" id="lp-train-stage1-patience" value="5" min="1"></label>
    </div>
    <div class="lp-field" id="lp-train-stage1-override-wrap" style="display:none">
      <label>Existing stage-1 checkpoint <span style="color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0">(optional; skip stage 1)</span></label>
      <input type="text" id="lp-train-stage1-override" placeholder="/user-data/.../tb_logs/.../checkpoints/epoch=...-best.ckpt">
    </div>
  </fieldset>

  <fieldset class="lp-group">
    <legend>Training</legend>
    <div class="lp-row">
      <label>Max epochs <input type="number" id="lp-train-epochs" value="300" min="1"></label>
      <label>Batch size <input type="number" id="lp-train-batch" value="16" min="1"></label>
    </div>
    <div class="lp-field lp-checkbox">
      <input type="checkbox" id="lp-train-predict-vids">
      <label for="lp-train-predict-vids">Predict on training videos after training</label>
    </div>
    <div class="lp-field lp-checkbox">
      <input type="checkbox" id="lp-train-save-vids">
      <label for="lp-train-save-vids">Render labeled videos</label>
    </div>
  </fieldset>

  <!-- Semi-supervised training (Temporal loss; uses unlabeled videos in videos/) -->
  <fieldset class="lp-group">
    <legend>Semi-supervised training</legend>
    <div class="lp-field lp-checkbox">
      <input type="checkbox" id="lp-train-semi-supervised">
      <label for="lp-train-semi-supervised">Use unlabeled videos via temporal loss</label>
    </div>
    <div id="lp-train-semi-supervised-params" style="display:none;margin-top:.4rem;gap:.6rem;align-items:center;flex-wrap:wrap">
      <label style="font-size:.78rem;color:var(--text-dim);display:flex;align-items:center;gap:.3rem">
        log_weight
        <input type="number" id="lp-train-temporal-log-weight" value="5.0" step="0.5" min="0" max="10"
          style="width:5rem;font-family:var(--mono);font-size:.78rem;padding:.2rem .35rem;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;color:var(--text)">
      </label>
      <label style="font-size:.78rem;color:var(--text-dim);display:flex;align-items:center;gap:.3rem">
        epsilon
        <input type="number" id="lp-train-temporal-epsilon" value="0.0" step="0.1" min="0" max="10"
          style="width:5rem;font-family:var(--mono);font-size:.78rem;padding:.2rem .35rem;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;color:var(--text)">
      </label>
      <span style="font-size:.7rem;color:var(--text-dim)">Stage 2 (MVT) auto-filters videos to sibling-paired sessions only. Stage 1 (SV) uses all videos.</span>
    </div>
  </fieldset>

  <button class="btn-primary" id="btn-lp-train-run">Start training</button>
  <pre class="lp-result" id="lp-train-result" hidden></pre>
</section>
