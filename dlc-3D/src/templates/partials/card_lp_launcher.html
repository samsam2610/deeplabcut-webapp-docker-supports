<section class="card dlc-theme" id="lp-launcher-card">
  <h2>Lightning-Pose</h2>
  <p class="subtitle">Open one of the LP / EKS panels.</p>
  <div class="lp-launcher-grid">
    <button class="inspect-btn lp-launcher-btn" data-lp-target="lp-convert-card">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4z"/><path d="M14 14h6v6h-6z"/><path d="M10 7h4"/><path d="M14 7v7"/><polyline points="11 17 14 14 17 17"/></svg>
      <span>Convert DLC&nbsp;&rarr;&nbsp;LP</span>
    </button>
    <button class="inspect-btn lp-launcher-btn" data-lp-target="lp-train-card">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span>Train LP Model</span>
    </button>
    <button class="inspect-btn lp-launcher-btn" data-lp-target="lp-predict-card">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
      <span>Predict (Inference)</span>
    </button>
    <button class="inspect-btn lp-launcher-btn" data-lp-target="lp-eks-card">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
      <span>EKS Smoothing</span>
    </button>
    <button class="inspect-btn lp-launcher-btn" data-lp-target="lp-jobs-card">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
      <span>LP Jobs</span>
    </button>
  </div>
</section>
