[pytest]
# Disk-fill guards. See ../../deeplabcut-webapp-docker/pytest.ini for the original
# incident (repeated/interrupted e2e runs leaked 614 GB into /tmp/pytest-of-sam).
# Keep only the most recent session's tmp dirs, and only for FAILED tests; combined
# with the pytest_sessionfinish cleanup hook in tests/conftest.py this bounds total
# /tmp usage to roughly "what the current run is doing".
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
