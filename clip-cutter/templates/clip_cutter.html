<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clip Cutter</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1117; color: #cdd9e5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; height: 100vh; display: flex; flex-direction: column; }
header { padding: 10px 16px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
header h1 { font-size: 15px; font-weight: 600; }
#status-msg { font-size: 11px; color: #768390; }
.app { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
.sidebar { width: 210px; flex-shrink: 0; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 10px 10px 6px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.sidebar-title { font-size: 10px; color: #768390; text-transform: uppercase; letter-spacing: 0.5px; }
.btn-sm { font-size: 10px; padding: 3px 8px; border-radius: 4px; cursor: pointer; border: 1px solid; background: transparent; }
.btn-green { border-color: #2ea043; color: #2ea043; }
.btn-green:hover { background: #2ea04322; }
.btn-blue { border-color: #388bfd; color: #388bfd; }
.btn-blue:hover { background: #388bfd22; }
.btn-red { border-color: #f85149; color: #f85149; }
.btn-red:hover { background: #f8514922; }
#template-grid { padding: 8px; display: flex; flex-wrap: wrap; gap: 5px; overflow-y: auto; flex: 1; }
.thumb { width: 58px; height: 44px; background: #1c2128; border-radius: 3px; border: 1px solid #30363d; cursor: pointer; position: relative; overflow: hidden; }
.thumb:hover { border-color: #f85149; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.65); font-size: 7px; color: #ccc; text-align: center; padding: 1px; }
#template-footer { padding: 6px 10px; border-top: 1px solid #30363d; font-size: 10px; color: #768390; flex-shrink: 0; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Video section */
.section { padding: 10px 14px; border-bottom: 1px solid #30363d; flex-shrink: 0; }
.section-label { font-size: 10px; color: #768390; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
#video-list { display: flex; flex-direction: column; gap: 3px; max-height: 110px; overflow-y: auto; }
.video-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; background: #1c2128; border-radius: 4px; border: 1px solid transparent; cursor: pointer; }
.video-row:hover { border-color: #388bfd44; }
.video-row.selected { border-color: #388bfd; background: #1a2535; }
.video-row.done { opacity: 0.45; cursor: default; }
.video-name { font-family: monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
.badge { font-size: 9px; padding: 1px 6px; border-radius: 3px; flex-shrink: 0; }
.badge-done { background: #1a3a1a; color: #2ea043; }
.badge-pending { background: #1a2535; color: #388bfd; }
#scan-btn { margin-top: 8px; padding: 6px 18px; background: #1f6feb; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; }
#scan-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#scan-btn:not(:disabled):hover { background: #388bfd; }

/* Progress */
#progress-section { padding: 8px 14px; border-bottom: 1px solid #30363d; background: #161b22; display: none; flex-shrink: 0; }

/* Pipeline steps */
#pipeline-steps { display: flex; align-items: center; gap: 0; margin-bottom: 8px; }
.pipeline-step { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #768390; }
.pipeline-step .step-dot { width: 8px; height: 8px; border-radius: 50%; background: #30363d; flex-shrink: 0; transition: background 0.2s; }
.pipeline-step.done .step-dot { background: #2ea043; }
.pipeline-step.active .step-dot { background: #1f6feb; box-shadow: 0 0 0 3px #1f6feb33; animation: pulse 1.2s ease-in-out infinite; }
.pipeline-step.done .step-label { color: #2ea043; }
.pipeline-step.active .step-label { color: #cdd9e5; }
.pipeline-connector { flex: 1; height: 1px; background: #30363d; min-width: 12px; margin: 0 4px; transition: background 0.2s; }
.pipeline-connector.done { background: #2ea043; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px #1f6feb33; } 50% { box-shadow: 0 0 0 5px #1f6feb22; } }

#progress-label { font-size: 10px; color: #768390; margin-bottom: 4px; display: flex; justify-content: space-between; }
#progress-bar { height: 4px; background: #30363d; border-radius: 2px; }
#progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #1f6feb, #7ec8e3); border-radius: 2px; transition: width 0.3s; }

/* Results + Player split */
.content-split { display: flex; flex: 1; overflow: hidden; }

/* Results pane (left 40%) */
.results-pane { width: 40%; border-right: 1px solid #30363d; display: flex; flex-direction: column; overflow: hidden; }
.results-pane-header { padding: 8px 12px 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
#results-count { font-size: 11px; color: #2ea043; }
#results-list { flex: 1; overflow-y: auto; padding: 6px 10px; display: flex; flex-direction: column; gap: 6px; }
.result-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #1c2128; border-radius: 5px; border: 1px solid #30363d; cursor: pointer; }
.result-card:hover { border-color: #388bfd44; }
.result-card.active-preview { border-color: #388bfd; background: #1a2535; }
.result-card.new { border-color: #388bfd55; }
.result-card.kept { opacity: 0.4; }
.result-card.rejected { opacity: 0.4; }
.result-meta { flex: 1; min-width: 0; }
.result-name { font-family: monospace; font-size: 11px; color: #cdd9e5; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-info { font-size: 10px; color: #768390; margin-bottom: 5px; }
.result-actions { display: flex; gap: 5px; flex-wrap: wrap; }
.sim-pill { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: #1a3a1a; color: #2ea043; flex-shrink: 0; }
.match-pill { font-size: 9px; padding: 1px 5px; border-radius: 3px; }
.match-known { background: #1a3a1a; color: #2ea043; }
.match-new { background: #1a2535; color: #388bfd; }

/* Player pane (right 60%) */
.player-pane { flex: 1; display: flex; flex-direction: column; background: #0d1117; overflow: hidden; }
#player-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #768390; }
#player-container { flex: 1; display: flex; flex-direction: column; padding: 8px; gap: 6px; }
#player-frame-wrap { flex: 1; background: #1c2128; border-radius: 4px; border: 1px solid #30363d; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 0; }
#player-frame { max-width: 100%; max-height: 100%; display: block; }
#player-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
#player-seek { flex: 1; accent-color: #1f6feb; cursor: pointer; }
#player-frame-num { font-size: 10px; color: #768390; white-space: nowrap; font-family: monospace; }
#player-actions { display: flex; gap: 6px; flex-shrink: 0; }
.player-btn { font-size: 11px; padding: 3px 10px; border-radius: 4px; cursor: pointer; border: 1px solid #30363d; background: transparent; color: #cdd9e5; }
.player-btn:hover { background: #30363d; }
.player-btn.active { border-color: #388bfd; color: #388bfd; }
#player-loop.active { border-color: #388bfd; color: #388bfd; }
</style>
</head>
<body>

<header>
  <h1>Clip Cutter</h1>
  <span id="status-msg">Ready</span>
</header>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Template Bank</span>
      <button class="btn-sm btn-green" onclick="initTemplate()">&#8635; Init</button>
    </div>
    <div id="template-grid"></div>
    <div id="template-footer">0 frames loaded</div>
  </div>

  <!-- Main panel -->
  <div class="main">
    <!-- Video list -->
    <div class="section">
      <div class="section-label">Select video to scan</div>
      <div id="video-list"></div>
      <button id="scan-btn" disabled onclick="startScan()">&#9654; Scan selected video</button>
    </div>

    <!-- Progress -->
    <div id="progress-section">
      <div id="pipeline-steps">
        <div class="pipeline-step" data-phase="coarse">
          <div class="step-dot"></div>
          <span class="step-label">Coarse scan</span>
        </div>
        <div class="pipeline-connector" data-after="coarse"></div>
        <div class="pipeline-step" data-phase="peak_detection">
          <div class="step-dot"></div>
          <span class="step-label">Peak detection</span>
        </div>
        <div class="pipeline-connector" data-after="peak_detection"></div>
        <div class="pipeline-step" data-phase="fine">
          <div class="step-dot"></div>
          <span class="step-label">Fine scan</span>
        </div>
      </div>
      <div id="progress-label">
        <span id="progress-text">Scanning&#8230;</span>
        <span id="progress-pct">0%</span>
      </div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <!-- Results + Player split -->
    <div class="content-split">
      <!-- Results list -->
      <div class="results-pane">
        <div class="results-pane-header">
          <span class="section-label">Detections</span>
          <span id="results-count"></span>
        </div>
        <div id="results-list"></div>
      </div>

      <!-- Player -->
      <div class="player-pane">
        <div id="player-placeholder">Click a detection to preview</div>
        <div id="player-container" style="display:none;">
          <div id="player-frame-wrap">
            <img id="player-frame" alt="video frame">
          </div>
          <div id="player-controls">
            <button class="player-btn" id="player-prev">&#9198;</button>
            <button class="player-btn" id="player-play">&#9654;</button>
            <button class="player-btn" id="player-next">&#9197;</button>
            <input type="range" id="player-seek" min="0" max="1000" value="0">
            <span id="player-frame-num">fr 0</span>
          </div>
          <div id="player-actions">
            <button class="player-btn" id="player-keyframe">&#8982; Key frame</button>
            <button class="player-btn active" id="player-loop">&#8617; Loop</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/clip-cutter/static/clip_cutter.js"></script>
</body>
</html>
